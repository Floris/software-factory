name: Validate observer gateway
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run isolated offline gateway regressions
        run: python3 -B -m unittest discover -s tests -p test_observer_gateway.py -v
      - name: Verify systemd example syntax without activation
        run: systemd-analyze verify examples/observer-gateway/software-factory-observer.socket examples/observer-gateway/software-factory-observer.service
