version: 1

factory_root: /srv/software-factory
repository_root: /srv/software-factory/repos
workspace_root: /srv/software-factory/worktrees
runtime_root: /srv/software-factory/runtime

# Copy this file to /etc/software-factory/repositories.yaml on the VPS.
# Canonical checkouts stay clean; task changes happen only in Git worktrees.

repositories:
  - id: software-factory
    path: /srv/software-factory/repos/software-factory
    remote: git@github.com:example-org/software-factory.git
    default_branch: main
    policy: factory-control
    beads:
      source: local
      remote: git+ssh://git@github.com/example-org/software-factory.git

  - id: expense-tracker
    path: /srv/software-factory/repos/expense-tracker
    remote: git@github.com:example-org/expense-tracker.git
    default_branch: master
    policy: product-dev
    beads:
      source: local
      remote: git+ssh://git@github.com/example-org/expense-tracker.git
    validation:
      commands:
        - [npm, run, lint]
        - [npm, run, typecheck]
        - [npm, test]
        - [npm, run, build]
    deployment:
      repository: website-k8s
      application: expense-tracker-dev
      environment: dev

  - id: website-k8s
    path: /srv/software-factory/repos/website-k8s
    remote: git@github.com:example-org/website-k8s.git
    default_branch: main
    policy: infrastructure-dev
    beads:
      source: local
      remote: git+ssh://git@github.com/example-org/website-k8s.git
