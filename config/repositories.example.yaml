version: 1

factory_root: /srv/software-factory
repository_root: /srv/software-factory/repos
workspace_root: /srv/software-factory/worktrees
runtime_root: /srv/software-factory/runtime

# Copy this file to /etc/software-factory/repositories.yaml on the VPS and
# replace every placeholder there. The root-provisioned copy is the live source
# of truth; this file contains no live repository or deployment state.
# Canonical checkouts stay clean; task changes happen only in Git worktrees.
# `credential_refs` values are non-secret lookup keys. The credential provider,
# not this file, stores and returns credential material for the exact operation.
# The `beads.remote` value is host registration data; do not duplicate it as a
# tracked `sync.remote` in a product repository's `.beads/config.yaml`.
# Legacy entries without this field are parseable for supervised migration but
# fail unattended preflight until every required operation is configured.
# Public dashboard publication is also default-off. The optional global block
# binds one exact public object and one root-owned public-copy manifest. The
# manifest is operator data outside repositories and Beads; repository content
# cannot approve public copy. Existing version 1 files without these optional
# global or per-repository blocks remain parseable and private; missing blocks
# or bindings grant no authority.

public_dashboard:
  enabled: false
  publisher_policy: factory-control
  schema_version: 1
  public_read_url: https://dashboard.example.invalid/snapshots/tasks-v1.json
  public_copy_manifest: /etc/software-factory/public-dashboard-copy.yaml
  object:
    audience: object-store://example-public-dashboard
    ref: snapshots/tasks-v1.json
    preprovisioned: true
    conditional_replace_required: true
    non_reusable_generation_required: true
  credential_refs:
    object_publish: credential-provider://public-dashboard/object-publish
    cache_purge: credential-provider://public-dashboard/cache-purge

repositories:
  - id: factory-control
    path: /srv/software-factory/repos/factory-control
    remote: git@github.com:example-org/factory-control.git
    default_branch: main
    policy: factory-control
    beads:
      source: local
      remote: git+ssh://git@github.com/example-org/factory-control.git
    credential_refs:
      git_read: credential-provider://factory-control/git-read
      git_write: credential-provider://factory-control/git-write
      beads_sync: credential-provider://factory-control/beads-sync
    public_dashboard:
      # Factory Beads opt in independently from global publisher authority.
      # This tracked example remains private.
      enabled: false
      public_alias: factory
      display_name: Software Factory

  # `deployment` is the version 1 shorthand retained for a repository with one
  # deployable component. New multi-component registrations use `deployments`.
  - id: example-service
    path: /srv/software-factory/repos/example-service
    remote: git@github.com:example-org/example-service.git
    default_branch: main
    policy: product-dev
    beads:
      source: local
      remote: git+ssh://git@github.com/example-org/example-service.git
    credential_refs:
      git_read: credential-provider://example-service/git-read
      git_write: credential-provider://example-service/git-write
      beads_sync: credential-provider://example-service/beads-sync
    validation:
      commands:
        - [make, verify]
    deployment:
      repository: deployment-config
      application: example-service-dev
      environment: dev

  # A product repository can publish several packages and map its components to
  # one or more GitOps applications without copying manifest desired state here.
  - id: example-suite
    path: /srv/software-factory/repos/example-suite
    remote: git@github.com:example-org/example-suite.git
    default_branch: main
    policy: product-dev
    beads:
      source: local
      remote: git+ssh://git@github.com/example-org/example-suite.git
    credential_refs:
      git_read: credential-provider://example-suite/git-read
      git_write: credential-provider://example-suite/git-write
      beads_sync: credential-provider://example-suite/beads-sync
      package_read: credential-provider://example-suite/package-read
    validation:
      commands:
        - [make, verify]
    public_dashboard:
      # An operator changes this to true only after approving the public copy
      # in the root-owned manifest. This tracked example remains private.
      enabled: false
      public_alias: example-suite
      display_name: Example Suite
    components:
      - id: api
        source: services/api
        packages:
          - type: oci-image
            repository: ghcr.io/example-org/example-suite-api
            tag_policy: full-commit-sha
            tag_prefix: sha-
      - id: worker
        source: services/worker
        packages:
          - type: oci-image
            repository: ghcr.io/example-org/example-suite-worker
            tag_policy: full-commit-sha
            tag_prefix: sha-
          - type: oci-image
            repository: ghcr.io/example-org/example-suite-maintenance
            tag_policy: full-commit-sha
            tag_prefix: sha-
    deployments:
      - repository: deployment-config
        application: example-suite-dev
        environment: dev
        components: [api, worker]
      - repository: deployment-config
        application: example-suite-preview
        environment: preview
        components: [api]

  - id: deployment-config
    path: /srv/software-factory/repos/deployment-config
    remote: git@github.com:example-org/deployment-config.git
    default_branch: main
    policy: infrastructure-dev
    beads:
      source: local
      remote: git+ssh://git@github.com/example-org/deployment-config.git
    credential_refs:
      git_read: credential-provider://deployment-config/git-read
      git_write: credential-provider://deployment-config/git-write
      beads_sync: credential-provider://deployment-config/beads-sync
      gitops_read: credential-provider://deployment-config/gitops-read
      gitops_write: credential-provider://deployment-config/gitops-write
